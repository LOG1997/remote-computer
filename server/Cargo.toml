[package]
name = "remote-computer"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
axum = { version = "0.8.9", features = ["ws"] }
axum-extra = { version = "0.12.6", features = ["typed-header"] }
axum-server = { version = "0.8.0", features = ["tls-rustls"] }
chrono = { version = "0.4.44", features = ["serde"] }
cpvc = "0.6.0"
dirs = "6.0.0"
dotenvy = "0.15.7"
env_logger = "0.11.10"
futures-util = "0.3.34"
home = "0.5.12"
http = "1.4.0"
hyper = "1.9.0"
include_dir = "0.7.4"
log = "0.4.32"
mime_guess = "2.0.5"
mio = "1.2.0"
open = "5.3.4"
rmqtt = { version = "0.21.0", features = ["ws"] }
rumqttc = "0.25.1"
rustls = { version = "0.23.4", features = ["ring"] }
rustls-pemfile = "2.2.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
simple_logger = "5.2.0"
smol = "2.0.2"
sysinfo = "0.39.0"
tokio = { version = "1.52.3", features = ["full"] }
tokio-rustls = "0.26.4"
toml = "1.1.2"
tower = "0.5.3"
tower-http = { version = "0.6.10", features = ["cors", "fs"] }
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = {version="0.3.23",features = ["env-filter"]}
volumecontrol = "0.1.4"
warp = "0.4.3"
